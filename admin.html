<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Brifly admin</title>
<style>
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:#000;color:#fff;font:16px/1.5 "DM Sans",Arial,sans-serif}
.w{max-width:760px;margin:0 auto;padding:24px 20px 60px}h1{font-size:28px;margin:0 0 18px}h2{font-size:20px;margin:30px 0 10px}
label{display:block;font-size:13px;font-weight:700;color:#fff;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:#fff;padding:10px 12px;border:1px solid #3a3a3a;border-radius:10px;background:#000}
input:focus,select:focus,textarea:focus{outline:2px solid #fff;outline-offset:1px}
input[type=file]{padding:9px}
textarea{min-height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px}.chk input{width:auto}
button{font:700 15px inherit;font-family:inherit;padding:11px 20px;border:1px solid #fff;border-radius:10px;background:#fff;color:#000;cursor:pointer;margin:16px 8px 0 0}
button:disabled{opacity:.5;cursor:wait}
button.g{background:#000;color:#fff;border-color:#3a3a3a;margin:0}button.g:hover{border-color:#fff}
button.d{background:#000;color:#ff8a80;border-color:#5a2a2a;margin:0}
.it{border:1px solid #2a2a2a;border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;background:#000}
.it small{color:#fff;opacity:.7;display:block}.off{opacity:.5}.bar{display:flex;justify-content:space-between;align-items:center}
.ok{color:#7ee2a8}.bad{color:#ff8a80}.hint{font-size:13px;color:#fff;opacity:.7;margin:4px 0 0}
.lf{display:flex;gap:12px;align-items:center}.th{width:44px;height:44px;border-radius:50%;object-fit:cover}
.pv{width:96px;height:96px;border-radius:50%;object-fit:cover;margin-top:10px;display:block}
@media(max-width:560px){.row{grid-template-columns:1fr}}
</style></head><body><div class="w">
<h1>Brifly admin</h1>
<form id="login"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
<button>Log in</button><p id="lmsg" class="bad"></p></form>
<div id="app" hidden>
<div class="bar"><span>Logged in</span><button class="g" id="out" type="button">Log out</button></div>
<h2 id="ft">Add a creative</h2>
<form id="f">
<div class="row"><div><label for="n">Full name</label><input id="n" required></div>
<div><label for="g">Male or female</label><select id="g"><option>Male</option><option>Female</option></select></div></div>
<label for="r">Roles</label><input id="r" required placeholder="Videographer, Video Editor">
<p class="hint">Separate several roles with commas. Spell each role the same way every time.</p>
<label for="ni">Industry (e.g. real estate, events, food)</label><input id="ni" placeholder="real estate, events, food">
<div class="row"><div><label for="c">City</label><input id="c" required list="cities" placeholder="Dubai"></div>
<div><label for="co">Country</label><input id="co" list="countries" value="UAE"></div></div>
<div class="row"><div><label for="b">Starting budget (AED per project)</label><input id="b" type="number" min="0" required></div>
<div><label for="p">Portfolio link</label><input id="p" placeholder="https://"></div></div>
<label for="bio">Short bio</label><textarea id="bio"></textarea>
<label for="ph">Photo</label><input id="ph" type="file" accept="image/*">
<p class="hint">Portrait or square photos work best. Photos are resized automatically.</p><img id="pv" class="pv" alt="" hidden>
<div class="chk"><input id="rm" type="checkbox"><label for="rm" style="margin:0">Can work remotely</label></div>
<button id="sv">Save creative</button><button class="g" id="cx" type="button" hidden>Cancel edit</button>
<p id="msg"></p>
<datalist id="cities"><option value="Dubai"><option value="Sharjah"><option value="Abu Dhabi"><option value="Fujairah"><option value="Ajman"><option value="Ras Al Khaimah"><option value="Umm Al Quwain"><option value="Riyadh"><option value="Jeddah"><option value="Manama"><option value="Doha"></datalist>
<datalist id="countries"><option value="UAE"><option value="Saudi Arabia"><option value="Bahrain"><option value="Qatar"></datalist></form>
<h2 id="cnt">Creatives</h2><div id="list"></div></div></div>
<script src="config.js"></script>
<script>
var $=function(s){return document.querySelector(s)},T=null,editId=null,rows=[];
var API=SUPABASE_URL+"/rest/v1/creatives";
function H(){var h={apikey:SUPABASE_KEY,"Content-Type":"application/json"};if(T)h.Authorization="Bearer "+T;return h}
function say(t,bad){var m=$("#msg");m.textContent=t;m.className=bad?"bad":"ok"}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function chk(r){if(r.status===401){say("Session expired. Refresh the page and log in again.",1);throw 0}
return r.text().then(function(t){if(!r.ok){say("Error: "+t,1);throw 0}return t?JSON.parse(t):null})}
$("#login").onsubmit=function(e){e.preventDefault();$("#lmsg").textContent="";
fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},
body:JSON.stringify({email:$("#em").value.trim(),password:$("#pw").value})}).then(function(r){return r.json()}).then(function(d){
if(!d.access_token){$("#lmsg").textContent="Wrong email or password.";return}
T=d.access_token;$("#login").hidden=true;$("#app").hidden=false;load()}).catch(function(){$("#lmsg").textContent="Could not connect. Check config.js."})};
$("#out").onclick=function(){location.reload()};
function load(){fetch(API+"?select=*&order=created_at.desc",{headers:H()}).then(chk).then(function(d){rows=d||[];draw()}).catch(function(){})}
function draw(){$("#cnt").textContent="Creatives ("+rows.length+")";
$("#list").innerHTML=rows.map(function(r){return'<div class="it'+(r.active?"":" off")+'"><div class="lf">'+(r.photo_url?'<img class="th" src="'+esc(r.photo_url)+'" alt="">':'')+'<div><strong>'+esc(r.name)+'</strong>'+(r.active?"":" (hidden)")+
'<small>'+esc((r.roles||[]).join(", "))+" · "+esc(r.city)+" · AED "+esc(r.min_budget)+'</small></div></div><div>'+
'<button class="g" data-a="e" data-i="'+r.id+'">Edit</button> <button class="g" data-a="h" data-i="'+r.id+'">'+(r.active?"Hide":"Show")+'</button> <button class="d" data-a="d" data-i="'+r.id+'">Delete</button></div></div>'}).join("")}
function reset(){$("#f").reset();$("#pv").hidden=true;$("#co").value="UAE";editId=null;$("#ft").textContent="Add a creative";$("#cx").hidden=true}
$("#cx").onclick=reset;
function shrink(file){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej()},"image/jpeg",.85)};im.onerror=function(){rej()};im.src=u})}
function upload(file,name){return shrink(file).then(function(b){var fn=Date.now()+"-"+name.toLowerCase().replace(/[^a-z0-9]+/g,"-")+".jpg";
return fetch(SUPABASE_URL+"/storage/v1/object/photos/"+fn,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+T,"Content-Type":"image/jpeg"},body:b}).then(function(r){
if(!r.ok)return r.text().then(function(t){say("Photo upload failed: "+t,1);throw 0});return SUPABASE_URL+"/storage/v1/object/public/photos/"+fn})})}
$("#ph").onchange=function(){var f=this.files[0];if(f){$("#pv").src=URL.createObjectURL(f);$("#pv").hidden=false}};
$("#f").onsubmit=function(e){e.preventDefault();
var body={name:$("#n").value.trim(),gender:$("#g").value,roles:$("#r").value.split(",").map(function(s){return s.trim()}).filter(Boolean),
niche:$("#ni").value.trim(),city:$("#c").value.trim(),country:$("#co").value.trim(),remote:$("#rm").checked,min_budget:Number($("#b").value)||0,
portfolio:$("#p").value.trim(),bio:$("#bio").value.trim()};
var f=$("#ph").files[0];$("#sv").disabled=true;say("Saving...");
(f?upload(f,body.name):Promise.resolve(null)).then(function(url){if(url)body.photo_url=url;
return fetch(editId?API+"?id=eq."+editId:API,{method:editId?"PATCH":"POST",headers:Object.assign(H(),{Prefer:"return=minimal"}),body:JSON.stringify(body)})})
.then(chk).then(function(){say(editId?"Updated.":"Saved. It is now live on Brifly.");reset();load()}).catch(function(){}).then(function(){$("#sv").disabled=false})};
$("#list").onclick=function(e){var b=e.target.closest("button");if(!b)return;var id=b.dataset.i,r=rows.filter(function(x){return String(x.id)===id})[0];
if(b.dataset.a==="e"){editId=r.id;$("#n").value=r.name;$("#g").value=r.gender||"Male";$("#r").value=(r.roles||[]).join(", ");$("#ni").value=r.niche||"";
$("#c").value=r.city||"";$("#co").value=r.country||"";$("#b").value=r.min_budget;$("#p").value=r.portfolio||"";$("#bio").value=r.bio||"";$("#rm").checked=!!r.remote;
if(r.photo_url){$("#pv").src=r.photo_url;$("#pv").hidden=false}else{$("#pv").hidden=true}$("#ft").textContent="Edit "+r.name;$("#cx").hidden=false;scrollTo(0,0)}
if(b.dataset.a==="h"){fetch(API+"?id=eq."+id,{method:"PATCH",headers:Object.assign(H(),{Prefer:"return=minimal"}),body:JSON.stringify({active:!r.active})}).then(chk).then(load).catch(function(){})}
if(b.dataset.a==="d"&&confirm("Delete "+r.name+" for good?")){fetch(API+"?id=eq."+id,{method:"DELETE",headers:H()}).then(chk).then(load).catch(function(){})}};
</script></body></html>
