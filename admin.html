<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Brifly admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#202124;font:16px/1.5 "DM Sans",Arial,sans-serif}
.w{max-width:760px;margin:0 auto;padding:24px 20px 60px}h1{font-size:28px;margin:0 0 18px}h2{font-size:20px;margin:30px 0 10px}
label{display:block;font-size:13px;font-weight:700;color:#5F6368;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #DFE1E5;border-radius:8px;background:#fff}
textarea{min-height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px}.chk input{width:auto}
button{font:700 15px inherit;font-family:inherit;padding:11px 20px;border:0;border-radius:8px;background:#3547F5;color:#fff;cursor:pointer;margin:16px 8px 0 0}
button.g{background:#F1F3F4;color:#202124;margin:0}button.d{background:#fde8e8;color:#b3261e;margin:0}
.it{border:1px solid #DFE1E5;border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.it small{color:#5F6368;display:block}.off{opacity:.55}.bar{display:flex;justify-content:space-between;align-items:center;color:#5F6368}
.ok{color:#137333}.bad{color:#b3261e}.hint{font-size:13px;color:#5F6368;margin:4px 0 0}
@media(max-width:560px){.row{grid-template-columns:1fr}}
</style></head><body><div class="w">
<h1>Brifly admin</h1>
<form id="login"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
<button>Log in</button><p id="lmsg" class="bad"></p></form>
<div id="app" hidden>
<div class="bar"><span>Logged in</span><button class="g" id="out" type="button">Log out</button></div>
<h2 id="ft">Add a creative</h2>
<form id="f">
<div class="row"><div><label for="n">Full name</label><input id="n" required></div>
<div><label for="g">Male or female</label><select id="g"><option>Male</option><option>Female</option></select></div></div>
<label for="r">Roles</label><input id="r" required placeholder="Videographer, Video Editor">
<p class="hint">Separate several roles with commas. Spell each role the same way every time.</p>
<label for="ni">Niche / specialties</label><input id="ni" placeholder="real estate, events, food">
<div class="row"><div><label for="c">City</label><input id="c" required placeholder="Dubai"></div>
<div><label for="co">Country</label><input id="co" value="UAE"></div></div>
<div class="row"><div><label for="b">Starting budget (AED per project)</label><input id="b" type="number" min="0" required></div>
<div><label for="p">Portfolio link</label><input id="p" placeholder="https://"></div></div>
<label for="bio">Short bio</label><textarea id="bio"></textarea>
<div class="chk"><input id="rm" type="checkbox"><label for="rm" style="margin:0">Can work remotely</label></div>
<button id="sv">Save creative</button><button class="g" id="cx" type="button" hidden>Cancel edit</button>
<p id="msg"></p></form>
<h2 id="cnt">Creatives</h2><div id="list"></div></div></div>
<script src="config.js"></script>
<script>
var $=function(s){return document.querySelector(s)},T=null,editId=null,rows=[];
var API=SUPABASE_URL+"/rest/v1/creatives";
function H(){var h={apikey:SUPABASE_KEY,"Content-Type":"application/json"};if(T)h.Authorization="Bearer "+T;return h}
function say(t,bad){var m=$("#msg");m.textContent=t;m.className=bad?"bad":"ok"}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function chk(r){if(r.status===401){say("Session expired. Refresh the page and log in again.",1);throw 0}
return r.text().then(function(t){if(!r.ok){say("Error: "+t,1);throw 0}return t?JSON.parse(t):null})}
$("#login").onsubmit=function(e){e.preventDefault();$("#lmsg").textContent="";
fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},
body:JSON.stringify({email:$("#em").value.trim(),password:$("#pw").value})}).then(function(r){return r.json()}).then(function(d){
if(!d.access_token){$("#lmsg").textContent="Wrong email or password.";return}
T=d.access_token;$("#login").hidden=true;$("#app").hidden=false;load()}).catch(function(){$("#lmsg").textContent="Could not connect. Check config.js."})};
$("#out").onclick=function(){location.reload()};
function load(){fetch(API+"?select=*&order=created_at.desc",{headers:H()}).then(chk).then(function(d){rows=d||[];draw()}).catch(function(){})}
function draw(){$("#cnt").textContent="Creatives ("+rows.length+")";
$("#list").innerHTML=rows.map(function(r){return'<div class="it'+(r.active?"":" off")+'"><div><strong>'+esc(r.name)+'</strong>'+(r.active?"":" (hidden)")+
'<small>'+esc((r.roles||[]).join(", "))+" · "+esc(r.city)+" · AED "+esc(r.min_budget)+'</small></div><div>'+
'<button class="g" data-a="e" data-i="'+r.id+'">Edit</button> <button class="g" data-a="h" data-i="'+r.id+'">'+(r.active?"Hide":"Show")+'</button> <button class="d" data-a="d" data-i="'+r.id+'">Delete</button></div></div>'}).join("")}
function reset(){$("#f").reset();$("#co").value="UAE";editId=null;$("#ft").textContent="Add a creative";$("#cx").hidden=true}
$("#cx").onclick=reset;
$("#f").onsubmit=function(e){e.preventDefault();
var body={name:$("#n").value.trim(),gender:$("#g").value,roles:$("#r").value.split(",").map(function(s){return s.trim()}).filter(Boolean),
niche:$("#ni").value.trim(),city:$("#c").value.trim(),country:$("#co").value.trim(),remote:$("#rm").checked,min_budget:Number($("#b").value)||0,
portfolio:$("#p").value.trim(),bio:$("#bio").value.trim()};
fetch(editId?API+"?id=eq."+editId:API,{method:editId?"PATCH":"POST",headers:Object.assign(H(),{Prefer:"return=minimal"}),body:JSON.stringify(body)})
.then(chk).then(function(){say(editId?"Updated.":"Saved. It is now live on Brifly.");reset();load()}).catch(function(){})};
$("#list").onclick=function(e){var b=e.target.closest("button");if(!b)return;var id=b.dataset.i,r=rows.filter(function(x){return String(x.id)===id})[0];
if(b.dataset.a==="e"){editId=r.id;$("#n").value=r.name;$("#g").value=r.gender||"Male";$("#r").value=(r.roles||[]).join(", ");$("#ni").value=r.niche||"";
$("#c").value=r.city||"";$("#co").value=r.country||"";$("#b").value=r.min_budget;$("#p").value=r.portfolio||"";$("#bio").value=r.bio||"";$("#rm").checked=!!r.remote;
$("#ft").textContent="Edit "+r.name;$("#cx").hidden=false;scrollTo(0,0)}
if(b.dataset.a==="h"){fetch(API+"?id=eq."+id,{method:"PATCH",headers:Object.assign(H(),{Prefer:"return=minimal"}),body:JSON.stringify({active:!r.active})}).then(chk).then(load).catch(function(){})}
if(b.dataset.a==="d"&&confirm("Delete "+r.name+" for good?")){fetch(API+"?id=eq."+id,{method:"DELETE",headers:H()}).then(chk).then(load).catch(function(){})}};
</script></body></html>
